plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.alpr_v1'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.alpr_v1"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // Urządzeniem docelowym jest smartfon ARM. Pominięcie bibliotek x86
        // istotnie zmniejsza APK zawierający dwa lokalne runtime'y ML.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // CameraX
    implementation libs.camerax.camera2
    implementation libs.camerax.lifecycle
    implementation libs.camerax.view

    // LiteRT: lokalny runtime oraz delegat GPU. Druga kaskada YOLO
    // rozpoznaje znaki, dlatego aplikacja nie korzysta z ML Kit OCR.
    implementation libs.google.litert.runtime
    implementation libs.google.litert.gpu
    implementation libs.onnxruntime.android
}
