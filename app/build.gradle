plugins {
    alias(libs.plugins.android.application)
}

def resolvedGitCommit = "unknown"
try {
    def gitProcess = ["git", "rev-parse", "HEAD"].execute(null, rootDir)
    gitProcess.waitFor()
    if (gitProcess.exitValue() == 0) {
        resolvedGitCommit = gitProcess.in.text.trim()
    }
} catch (Exception ignored) {
    // Archiwum źródłowe bez katalogu .git pozostaje budowalne.
}
def resolvedBuiltAtUtc = java.time.Instant.now().toString()

android {
    namespace = 'com.example.alpr_v1'
    ndkVersion = '29.0.14033849'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.alpr_v1"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "GIT_COMMIT", "\"${resolvedGitCommit}\""
        buildConfigField "String", "BUILT_AT_UTC", "\"${resolvedBuiltAtUtc}\""

        // Urządzeniem docelowym jest smartfon ARM. Pominięcie bibliotek x86
        // istotnie zmniejsza APK zawierający dwa lokalne runtime'y ML.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // CameraX
    implementation libs.camerax.camera2
    implementation libs.camerax.lifecycle
    implementation libs.camerax.view

    // LiteRT: lokalny runtime oraz delegat GPU. Druga kaskada YOLO
    // rozpoznaje znaki, dlatego aplikacja nie korzysta z ML Kit OCR.
    implementation libs.google.litert.runtime
    implementation libs.google.litert.gpu
    implementation libs.onnxruntime.android
}
